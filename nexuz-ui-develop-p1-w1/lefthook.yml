pre-commit:
  parallel: false
  commands:
    check:
      name: Format-lint-and-sort-classes
      run: pnpm exec biome check --write .
      stage_fixed: true

commit-msg:
  commands:
    validate-commit-message:
      run: |
        if ! sed -n 1p {1} | tr -d '\r' | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9-]+\): .+$'; then
          echo '❌ Invalid format. Use: type(scope): message (scope is required)'
          echo '   Example: feat(auth): implement authentication feature'
          exit 1
        fi

        if sed -n 1p {1} | tr -d '\r' | grep -q '[A-Z]'; then
          echo '❌ Commit message must be lowercase'
          echo '   Example: feat(auth): implement authentication feature'
          exit 1
        fi