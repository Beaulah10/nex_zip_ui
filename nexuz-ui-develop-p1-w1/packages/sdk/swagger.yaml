openapi: 3.0.3
info:
  title: NEXUZ API
  description: >-
    API for retrieving bundle information based on flight details and passenger
    information. It also retrieves seatMap based on the cabin requested by the
    passenger for its respective flights and provides details of available
    ancillaries for a particular flight.
  version: 1.0.0
tags:
  - name: Core
    x-displayName: Core
  - name: Search
    x-displayName: Search
  - name: Offers
    x-displayName: Offers
  - name: SeatMap
    x-displayName: SeatMap
  - name: Ancillaries
    x-displayName: Ancillaries
  - name: Summary PNR
    x-displayName: Summary PNR
  - name: Create Order
    x-displayName: Create Order
  - name: Payment
    x-displayName: Payment
  - name: Payment Status
    x-displayName: Payment Status
  - name: Retrieve PNR
    x-displayName: Retrieve PNR
paths:
  /auth/token:
    post:
      tags:
        - Core
      summary: Retrieve security token
      description: Generates and returns a security token.
      responses:
        "200":
          description: Successfully retrieved security token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-001-core_Token"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-001-core_ErrorResponse"
              example:
                code: NEXUZR001E001
                description: Token WBS Call Failed
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-001-core_ErrorResponse"
              examples:
                systemError:
                  value:
                    code: NEXUZCMNE002
                    description: System Error Occurred
                internalError:
                  value:
                    code: NEXUZCMNE003
                    description: Internal Error Occurred
  /search/routes:
    get:
      tags:
        - Search
      summary: Retrieve airport route
      description: >-
        To retrieve travel routes from the Radixx System and return valid origin
        and destination airport codes as the response.
      parameters:
        - in: query
          name: language
          schema:
            type: string
            example: en
          required: true
          description: language code is required.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_AirportRouteResponse"
              example:
                data:
                  routeInfo:
                    - - origin: BKK
                        destination: NRT
                      - origin: NRT
                        destination: SIN
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              example:
                code: NEXUZCMNE001
                description: Required input is missing
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              example:
                code: NEXUZR002E001
                description: Failed to RetrieveAirportRoute
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              examples:
                systemError:
                  value:
                    code: NEXUZCMNE002
                    description: System error occurred
                internalError:
                  value:
                    code: NEXUZCMNE003
                    description: Internal error occurred
  /search/calendar-fares:
    get:
      tags:
        - Search
      summary: Retrieve calendar fare date range
      description: >-
        Retrieves the lowest fare details for each date and cabin within a
        specified calendar date range.
      parameters:
        - in: query
          name: promotionCode
          description: Promotional code
          schema:
            type: string
            example: ABC123
          required: false
        - in: query
          name: routes
          description: |
            Comma-separated airport codes representing the route.
            - One-way / Round-trip: `"NRT,BKK"` (origin,destination)
            - Connecting: `"BKK,NRT,SIN"` (origin,stopover,destination)
          schema:
            type: string
            example: NRT,BKK
          required: true
        - in: query
          name: departureDateFrom
          description: Outbound departure date in `yyyy-MM-dd` format
          schema:
            type: string
            example: "2026-06-01"
          required: true
        - in: query
          name: departureDateTo
          description: |
            Inbound date in `yyyy-MM-dd` format for round-trips
          schema:
            type: string
            example: "2026-06-02"
          required: false
        - in: query
          name: language
          description: Language code
          schema:
            type: string
            example: en
          required: true
        - in: query
          name: currency
          description: Currency code
          schema:
            type: string
            example: JPY
          required: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_CalendarFaresResponse"
              examples:
                oneWay:
                  summary: One-way / One-way connecting scenario
                  value:
                    data:
                      outbound:
                        - cabin: ZIPFULLFLAT
                          dates:
                            - date: "2026-05-25"
                              baseFareForPromotion: 43535.01
                              lowestPrice: 50000.01
                        - cabin: STANDARD
                          dates:
                            - date: "2026-05-25"
                              baseFareForPromotion: 43535.01
                              lowestPrice: 50000.01
                roundTrip:
                  summary: Round-trip scenario
                  value:
                    data:
                      outbound:
                        - cabin: ZIPFULLFLAT
                          dates:
                            - date: "2026-05-25"
                              baseFareForPromotion: 43535.01
                              lowestPrice: 50000.01
                        - cabin: STANDARD
                          dates:
                            - date: "2026-05-25"
                              baseFareForPromotion: 43535.01
                              lowestPrice: 50000.01
                      inbound:
                        - cabin: ZIPFULLFLAT
                          dates:
                            - date: "2026-05-25"
                              baseFareForPromotion: 43535.01
                              lowestPrice: 50000.01
                        - cabin: STANDARD
                          dates:
                            - date: "2026-05-25"
                              baseFareForPromotion: 43535.01
                              lowestPrice: 50000.01
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              example:
                code: NEXUZCMNE001
                description: Required Input is Missing
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              examples:
                boundNotAvailable:
                  value:
                    code: NEXUZR002E051
                    description: Requested Bound is not available
                noValidData:
                  value:
                    code: NEXUZR002E052
                    description: No valid data found in the response
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              example:
                code: NEXUZR002E050
                description: Failed to RetrieveFareQuoteDateRange
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-002-search_ErrorResponse"
              examples:
                systemError:
                  value:
                    code: NEXUZCMNE002
                    description: System Error Occured
                internalError:
                  value:
                    code: NEXUZCMNE003
                    description: Internal Error Occured
  /search/flights:
    get:
      tags:
        - Search
      summary: Search available flights and retrieve fare quotes
      description: Retrieves available flights and fare quotes.
      operationId: searchFlights
      parameters:
        - name: routes
          in: query
          required: true
          description: Comma-separated airport codes representing the route.
          schema:
            type: string
          example: NRT,BKK
        - name: departureDateFrom
          in: query
          required: true
          description: Outbound departure date in `yyyy-MM-dd` format.
          schema:
            type: string
          example: "2026-10-05"
        - name: departureDateTo
          in: query
          required: false
          description: Return departure date in `yyyy-MM-dd` format for round-trips.
          schema:
            type: string
          example: "2026-10-14"
        - name: adult
          in: query
          required: true
          description: Number of adult passengers.
          schema:
            type: string
          example: "2"
        - name: childA
          in: query
          required: false
          description: Number of Child A passengers.
          schema:
            type: string
          example: "1"
        - name: childB
          in: query
          required: false
          description: Number of Child B passengers.
          schema:
            type: string
          example: "1"
        - name: childC
          in: query
          required: false
          description: Number of Child C passengers.
          schema:
            type: string
          example: "1"
        - name: infant
          in: query
          required: false
          description: Number of infant passengers.
          schema:
            type: string
          example: "1"
        - name: language
          in: query
          required: true
          description: Language code for response content.
          schema:
            type: string
          example: ja
        - name: currency
          in: query
          required: true
          description: Currency code for fare amounts.
          schema:
            type: string
          example: JPY
        - name: promotionCode
          in: query
          required: false
          description: Promotional code to apply discounts.
          schema:
            type: string
          example: PROMO2026
      responses:
        "200":
          description: Flights retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-003-flights_FlightSearchResponse"
        "400":
          description: Bad Request – input validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-003-flights_ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-003-flights_ErrorResponse"
        "422":
          description: Unprocessable Entity – error occurred during fare quote retrieval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-003-flights_ErrorResponse"
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-003-flights_ErrorResponse"
  /offers/bundles:
    post:
      tags:
        - Offers
      summary: Retrieve bundles available for specified flight details
      description: >-
        Returns available service bundles (e.g., meals+baggage, etc.) for given
        flight segments and passenger composition.
      operationId: retrieveOfferBundles
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            example: JPY
      requestBody:
        required: true
        description: Request payload containing route, passenger, and flight details.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-004-offers_BundleRequest"
      responses:
        "200":
          description: Bundle retrieval successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_BundleResponse"
        "400":
          description: Bad Request - Required Input is Missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                missingRequiredInput:
                  summary: Required input is missing
                  value:
                    code: NEXUZCMNE001
                    description: Required Input is Missing
        "404":
          description: Not found - Required Input is Missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                missingRequiredInput:
                  summary: no valid date is found
                  value:
                    code: NEXUZCMNE004
                    description: No Valid Data found
        "422":
          description: >-
            Unprocessable Entity - Request cannot be processed due to business
            validation issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              example:
                code: NEXUZR004E002
                description: Failed to Retrieve service bundle details
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                internalError:
                  summary: Internal error
                  value:
                    code: NEXUZCMNE003
                    description: Internal Error Occurred
  /offers/seatMap:
    post:
      tags:
        - SeatMap
      summary: Search seat availability for requested cabin
      description: >-
        Provides the seat map details, including real-time seat availability,
        for a specified flight and cabin requested by the passenger.
      operationId: retrieveSeatMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-004-offers_SeatMapRequest"
      responses:
        "200":
          description: SeatMap response received successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_FlightSeatMapResponse"
        "400":
          description: Bad Request – input validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                missingRequiredInput:
                  summary: Required input is missing
                  value:
                    code: NEXUZCMNE001
                    description: Required Input is Missing
        "404":
          description: No valid data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              example:
                code: NEXUZCMNE004
                description: No valid data found
        "422":
          description: Unprocessable Entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              example:
                code: NEXUZR004E051
                description: Failed to Retrieve Flight SeatMap
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                internalError:
                  summary: Internal error
                  value:
                    code: NEXUZCMNE003
                    description: Internal Error Occurred
  /offers/ancillaries:
    post:
      tags:
        - Ancillaries
      summary: Retrieve ancillaries
      description: >
        Retrieves ancillary services for a given flight based on service
        category and passenger details.
      parameters:
        - name: currency
          in: query
          required: true
          description: Currency code for retrieving ancillaries amount.
          schema:
            type: string
            example: JPY
      requestBody:
        required: true
        description: >-
          Request payload containing flight details, service category and number
          of passengers.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-004-offers_AncillaryRequest"
      responses:
        "200":
          description: Ancillaries retrieved Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_AncillaryResponse"
        "400":
          description: Bad Request - Required Input is Missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              example:
                code: NEXUZCMNE001
                description: Required Input is Missing
        "404":
          description: Not found - No valid data / No valid ancillaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                noData:
                  value:
                    code: NEXUZCMNE004
                    description: No valid data found
                noAncillaries:
                  value:
                    code: NEXUZR004E102
                    description: >-
                      No valid ancillaries are available  for the requested
                      flight
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              example:
                code: NEXUZR004E101
                description: Error occurred in RetrieveAARQuote
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_ErrorResponse"
              examples:
                systemError:
                  value:
                    code: NEXUZCMNE002
                    description: System Error Occured
                internalError:
                  value:
                    code: NEXUZCMNE003
                    description: Internal Error Occured
  /orders/prepare:
    post:
      operationId: summaryPNR
      summary: Summary PNR
      description: >
        Prepares a summary PNR by validating inputs, retrieving fare quotes,
        processing ancillary services, bundles and seat selections, and
        generating an encrypted Arkose token.
      tags:
        - Summary PNR
      parameters:
        - name: currency
          in: query
          required: true
          description: currency code.
          schema:
            type: string
          example: JPY
        - name: language
          in: query
          required: true
          description: language code.
          schema:
            type: string
          example: en
      requestBody:
        required: true
        description: >-
          Summary PNR preparation request containing flight and passenger
          details.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-005_APIs_SummaryRequest"
      responses:
        "200":
          description: >-
            Summary PNR prepared successfully. Returns encrypted Arkose token
            for fraud detection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_SummaryResponse"
              examples:
                success:
                  summary: Success status
                  value:
                    data:
                      token: token value
                successWithWarning:
                  summary: Success with warning
                  value:
                    warning:
                      code: NEXUZR005W001
                      description: Unable to proceed further
                    data:
                      token: token value
        "400":
          description: Input parameter validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_ErrorResponse"
              example:
                code: NEXUZCMNE001
                description: Required Input is Missing
        "422":
          description: Retrieve FareQuote Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_ErrorResponse"
              example:
                code: NEXUZR005E001
                description: Required Input is Missing
        "500":
          description: >-
            Downstream service call failure. Indicates system error during token
            generation, fare quote retrieval, or other critical operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_ErrorResponse"
              example:
                code: NEXUZCMNE003
                description: Internal Error Occurred
  /orders:
    post:
      tags:
        - Create Order
      summary: Create Order
      operationId: createOrder
      parameters:
        - name: currency
          in: query
          required: true
          description: Represents the reservation currency.
          schema:
            type: string
            example: JPY
        - name: language
          in: query
          required: true
          description: Represents the reservation language.
          schema:
            type: string
            example: en
      requestBody:
        required: true
        description: >-
          Request payload containing the arkose token, passengers, and recipient
          information.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-005_APIs_CreateOrderRequest"
      responses:
        "200":
          description: Successful order creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_CreateOrderResponse"
              examples:
                successResponse:
                  summary: Success status
                  value:
                    data:
                      statusCheckKey: 01w2345-6y7t-89d2-de2345tr345c
                      paymentReferenceId: 123456
                      redirectionUrl: https://payment.example.com/redirect
                successWithWarning:
                  summary: Success with warning
                  value:
                    warning:
                      code: NEXUZR005W001
                      description: Destination address cannot be added
                    data:
                      statusCheckKey: String
                      paymentReferenceId: string
                      redirectionUrl: string
        "400":
          description: Required Input is Missing or Invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_ErrorResponse"
              example:
                code: NEXUZCMNE001
                description: Required input is missing
        "422":
          description: >-
            Unprocessable Entity - Request cannot be processed due to business
            validation issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_ErrorResponse"
              example:
                code: NEXUZR005E150
                description: Unable to proceed further
        "500":
          description: Internal server error or system error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-005_APIs_ErrorResponse"
              example:
                code: NEXUZCMNE003
                description: Internal error occurred
  /payment/initialize:
    post:
      tags:
        - Payment
      summary: Initiate payment session
      description: >-
        This endpoint is responsible for generating the Payment Reference ID,
        creating the POP Order ID, and obtaining the payment redirection URL
        from POP.
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: Represents the reservation currency.
          example: JPY
        - name: language
          in: query
          required: true
          schema:
            type: string
          description: Represents the reservation language.
          example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/NEXUZ-R-006-payment_InitializePaymentRequest
      responses:
        "200":
          description: Payment session initiated successfully.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/NEXUZ-R-006-payment_InitializePaymentResponse
        "400":
          description: Bad Request - Required input is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-006-payment_ErrorResponse"
              examples:
                requiredInputMissing:
                  summary: Required input is not available
                  value:
                    code: NEXUZCMNE001
                    description: Required input is missing
        "422":
          description: Unprocessable Entity - downstream service processing failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-006-payment_ErrorResponse"
              examples:
                insertExternalPaymentFailed:
                  summary: InsertExternalProcessedPayment service call failed
                  value:
                    code: NEXUZR006E001
                    description: Unable to proceed further
        "500":
          description: >-
            Internal Server Error - downstream invocation/connection/execution
            failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-006-payment_ErrorResponse"
              examples:
                systemError:
                  summary: System error occurred
                  value:
                    code: NEXUZCMNE002
                    description: System error occurred
  /payment/{statusCheckKey}/status:
    post:
      tags:
        - Payment Status
      summary: Retrieve payment status
      description: >
        This endpoint is responsible for retrieving the payment status from POP
        and updating other systems based on the status, and returning a
        consolidated status to the UI.
      operationId: retrievePaymentStatus
      parameters:
        - name: statusCheckKey
          in: path
          required: true
          description: Represents order identifier to look up the payment order in POP.
          schema:
            type: string
        - name: currency
          in: query
          required: true
          description: Represents reservation currency.
          schema:
            type: string
          example: JPY
        - name: language
          in: query
          required: true
          description: Represents reservation language.
          schema:
            type: string
          example: ja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-006-payment_PaymentStatusRequest"
      responses:
        "200":
          description: Consolidated response returned to UI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-006-payment_PaymentStatusResponse"
              examples:
                success:
                  summary: Success status
                  value:
                    data:
                      status: Success
                      confirmationNumber: ABC123
                pending:
                  summary: Processing or Created status
                  value:
                    data:
                      status: Pending
                successWithWarning:
                  summary: Success with warning
                  value:
                    warning:
                      code: NEXUZR006W001
                      description: Unable to proceed further
                    data:
                      status: Success
                      confirmationNumber: ABC123
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-006-payment_ErrorResponse"
              examples:
                requiredInputMissing:
                  value:
                    code: NEXUZCMNE001
                    description: Required input is missing
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NEXUZ-R-006-payment_ErrorResponse"
                  - $ref: >-
                      #/components/schemas/NEXUZ-R-006-payment_PaymentStatusResponse
              examples:
                failedToGeneratePopToken:
                  value:
                    code: NEXUZR006E050
                    description: Unable to proceed further
                failedToRetrievePaymentStatus:
                  value:
                    code: NEXUZR006E051
                    description: Unable to proceed further
                paymentStatusIsFailed:
                  value:
                    data:
                      status: Failed
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NEXUZ-R-006-payment_ErrorResponse"
              examples:
                systemError:
                  value:
                    code: NEXUZCMNE002
                    description: System error occurred
                internalError:
                  value:
                    code: NEXUZCMNE003
                    description: Internal error occurred
  /orders/info:
    post:
      tags:
        - Retrieve PNR
      summary: Retrieve PNR information for specified confirmation number.
      description: >-
        Returns flight, passenger, ticket and related information for the
        specified PNR.
      operationId: retrievePnrInfo
      requestBody:
        required: true
        description: Request body containing the confirmationNumber detail.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NEXUZ-R-007-order-management_PnrInfoRequest"
      responses:
        "200":
          description: Successful response with PNR information.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/NEXUZ-R-007-order-management_PnrInfoResponse
              example:
                data:
                  airlineInfo:
                    code: ZG
                    airline: ZipAir
                  passenger:
                    code: UNKNOWN
                    name: FIRSTLAST FIRSTFIRST FIRSTMIDDLE
                  ticket:
                    code: 2X7IVO
                    adultCount: 2
                    childCount: 3
                    restricted: 0
                    issueDate:
                      dayOfMonth: 5
                      month: 3
                      year: 2025
                  issuer:
                    address1: ZipAir
                    postalCode: "1400002"
                    city: Tokyo
                    countryCode: JP
                  flight:
                    - carrierCode: ZG
                      flightCode: ZG095
                      stopOverCode: 0
                      departureAirport: NRT
                      arrivalAirport: MNL
                      departureDate:
                        dayOfMonth: 5
                        month: 6
                        year: 2025
                      fare:
                        class: O
                        basis: O0ZSA0A
                      amount:
                        value: 28360
                        currencyCode: JPY
                        exponent: 0
                    - carrierCode: ZG
                      flightCode: ZG096
                      stopOverCode: 0
                      departureAirport: MNL
                      arrivalAirport: NRT
                      departureDate:
                        dayOfMonth: 13
                        month: 7
                        year: 2025
                      fare:
                        class: O
                        basis: O0ZSA0A
                      amount:
                        value: 28360
                        currencyCode: JPY
                        exponent: 0
                  invoiceNumber: ""
                  agent:
                    code: "0"
                    name: ZipAir
                  capture:
                    debitCreditIndicator: credit
        "400":
          description: Bad request - Required Input is Missing
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/NEXUZ-R-007-order-management_ErrorResponse
              example:
                code: NEXUZCMNE001
                description: Required input is missing
        "404":
          description: No valid data found.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/NEXUZ-R-007-order-management_ErrorResponse
              example:
                code: NEXUZCMNE004
                description: No valid data found
        "422":
          description: >-
            Unprocessable Entity - Request cannot be processed due to business
            validation issues.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/NEXUZ-R-007-order-management_ErrorResponse
              example:
                code: NEXUZR007E001
                description: Failed to retrieve RetrievePnr
        "500":
          description: Internal or System Server Error
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/NEXUZ-R-007-order-management_ErrorResponse
              examples:
                internalServerError:
                  summary: Internal Error
                  value:
                    code: NEXUZCMNE003
                    description: Internal error occurred
                systemError:
                  summary: System Error
                  value:
                    code: NEXUZCMNE002
                    description: System error occurred
components:
  schemas:
    NEXUZ-R-001-core_Token:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: >-
                The WBS-generated security token. The token is an encrypted
                value and is valid for 30 minutes.
              example: 666e14a19cdb0aj48a6bp78beazdsejaudb4d11a8dad
          required:
            - accessToken
      required:
        - data
    NEXUZ-R-001-core_ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Custom error code
        description:
          type: string
          description: Error description
      required:
        - code
        - description
    NEXUZ-R-002-search_AirportRouteResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NEXUZ-R-002-search_ArrayOfRoutes"
    NEXUZ-R-002-search_ArrayOfRoutes:
      type: object
      required:
        - routeInfo
      properties:
        routeInfo:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/NEXUZ-R-002-search_Routes"
    NEXUZ-R-002-search_Routes:
      type: object
      required:
        - origin
        - destination
      properties:
        origin:
          type: string
          example: BKK
          description: Origin airport code
        destination:
          type: string
          example: NRT
          description: Destination airport code
    NEXUZ-R-002-search_CalendarFaresResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NEXUZ-R-002-search_CalendarFaresData"
    NEXUZ-R-002-search_CalendarFaresData:
      type: object
      required:
        - outbound
      properties:
        outbound:
          $ref: "#/components/schemas/NEXUZ-R-002-search_BoundFareData"
        inbound:
          $ref: "#/components/schemas/NEXUZ-R-002-search_BoundFareData"
    NEXUZ-R-002-search_BoundFareData:
      type: array
      items:
        type: object
        required:
          - cabin
          - dates
        properties:
          cabin:
            type: string
            example: ZIPFULLFLAT
            description: Cabin type (e.g., STANDARD or ZIPFULLFLAT).
          dates:
            type: array
            description: Fare details for the bound grouped by travel date.
            items:
              $ref: "#/components/schemas/NEXUZ-R-002-search_FareDateEntry"
    NEXUZ-R-002-search_FareDateEntry:
      type: object
      required:
        - date
        - lowestPrice
      properties:
        date:
          type: string
          example: "2026-05-25"
          description: Travel date to be shown in the calendar.
        baseFareForPromotion:
          type: number
          format: double
          example: 43535.01
          description: Applicable when a promoCode is provided.
        lowestPrice:
          type: number
          format: double
          example: 50000.01
          description: Lowest fare amount for the cabin on the given date.
    NEXUZ-R-002-search_ErrorResponse:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Custom error code
        description:
          type: string
          description: Error description
    NEXUZ-R-003-flights_FlightSearchResponse:
      type: object
      description: Top-level response wrapper for flight search.
      properties:
        data:
          type: object
          properties:
            outbound:
              $ref: "#/components/schemas/NEXUZ-R-003-flights_BoundData"
            inbound:
              allOf:
                - $ref: "#/components/schemas/NEXUZ-R-003-flights_BoundData"
              description: Inbound flight data. Only present for round-trip requests.
              nullable: true
    NEXUZ-R-003-flights_BoundData:
      type: object
      description: Flight data for a single bound (outbound or inbound).
      properties:
        airCalendarFare:
          type: array
          description: Calendar-level fare summary per date.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_AirCalendarFare"
        flightsByDate:
          type: array
          description: List of flights grouped by departure date.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_FlightsByDate"
    NEXUZ-R-003-flights_AirCalendarFare:
      type: object
      description: Minimum fare summary for a specific date.
      required:
        - date
        - totalFareAmount
        - baseFareAmount
      properties:
        date:
          type: string
          description: The departure date in `yyyy-MM-dd` format.
          example: "2026-10-05"
        baseFareAmount:
          type: number
          format: decimal
          description: >-
            Total base fare amount of the flight with the minimum total fare on
            that date.
          example: 18000
        totalFareAmount:
          type: number
          format: decimal
          description: >-
            Minimum total fare amount for adult passenger across all flights on
            that date.
          example: 20160
    NEXUZ-R-003-flights_FlightsByDate:
      type: object
      description: Flights available on a specific departure date.
      required:
        - date
        - flights
      properties:
        date:
          type: string
          description: Departure date in `yyyy-MM-dd` format.
          example: "2026-10-05"
        flights:
          type: array
          description: List of available flights on this date.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_Flight"
    NEXUZ-R-003-flights_Flight:
      type: object
      description: A single flight itinerary (direct or connecting).
      required:
        - overallFlightTime
        - segments
      properties:
        transitTime:
          type: string
          nullable: true
          description: Layover/transit time for connecting flights in `HH:MM` format.
          example: "05:30"
        overallFlightTime:
          type: string
          description: >-
            Total travel time including flight time of all segments and transit
            time in `HH:MM` format.
          example: "10:50"
        segments:
          type: array
          description: Flight segment(s).
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_Segment"
    NEXUZ-R-003-flights_Segment:
      type: object
      description: A single flight segment (leg).
      required:
        - carrierCode
        - origin
        - destination
        - scheduledDepartureArrivalDateTime
        - flightTime
        - flightNumber
        - pfid
        - lfid
        - fareInfos
      properties:
        previousDayIndicator:
          type: boolean
          nullable: true
          description: |
            Set to `true` if the arrival date is before the departure date.
            Set to `null` if arrival date equals departure date.
        nextDayIndicator:
          type: boolean
          nullable: true
          description: |
            Set to `true` if the arrival date is after the departure date.
            Set to `null` if arrival date equals departure date.
        carrierCode:
          type: string
          description: Operating carrier IATA code.
          example: ZG
        origin:
          type: string
          description: Departure airport IATA code.
          example: NRT
        destination:
          type: string
          description: Arrival airport IATA code.
          example: BKK
        scheduledDepartureArrivalDateTime:
          $ref: "#/components/schemas/NEXUZ-R-003-flights_ScheduledDateTime"
        flightTime:
          type: string
          description: Flight duration in `HH:MM` format.
          example: "07:30"
        flightNumber:
          type: string
          description: Flight number.
          example: "052"
        pfid:
          type: integer
          description: Physical Flight ID.
          example: 232
        lfid:
          type: integer
          description: Logical Flight ID.
          example: 232
        fareInfos:
          type: array
          description: Fare information grouped by cabin (STANDARD and/or ZIPFULLFLAT).
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_FareInfo"
    NEXUZ-R-003-flights_ScheduledDateTime:
      type: object
      required:
        - departureDateTime
        - departureDateTimeOffset
        - arrivalDateTime
        - arrivalDateTimeOffset
      properties:
        departureDateTime:
          type: string
          description: Scheduled departure date/time (local time, no offset).
          example: "2026-10-05T23:10:00"
        departureDateTimeOffset:
          type: string
          description: Departure date/time in UTC with timezone offset.
          example: "2026-10-05T14:10:00+00:00"
        arrivalDateTime:
          type: string
          description: Scheduled arrival date/time (local time, no offset).
          example: "2026-10-06T07:30:00"
        arrivalDateTimeOffset:
          type: string
          description: Arrival date/time in UTC with timezone offset.
          example: "2026-10-05T22:30:00+00:00"
    NEXUZ-R-003-flights_FareInfo:
      type: object
      description: Fare detail grouped by cabin type.
      required:
        - cabin
        - boundSummary
        - fareDetails
      properties:
        cabin:
          type: string
          description: Cabin type.
          example: STANDARD
        boundSummary:
          $ref: "#/components/schemas/NEXUZ-R-003-flights_BoundSummary"
        fareDetails:
          type: array
          description: Per-passenger-type fare breakdown for this cabin.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_FareDetail"
    NEXUZ-R-003-flights_BoundSummary:
      type: object
      description: >
        Aggregated fare summary for a specific cabin, covering all requested
        passenger types.
      required:
        - totalFlightAmount
        - passengerWiseFares
        - totalTaxAmount
        - taxBreakDown
      properties:
        totalFlightAmount:
          type: number
          format: decimal
          description: Total fare amount for all passengers in this cabin.
          example: 45000
        promotionalAmount:
          type: number
          format: decimal
          nullable: true
          description: Total promotional discount amount applied to this cabin.
          example: 3000
        passengerWiseFares:
          type: array
          description: Fare breakdown per passenger type.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_PassengerWiseFare"
        totalTaxAmount:
          type: number
          format: decimal
          description: Total tax amount for all passengers in this cabin.
          example: 5000
        taxBreakDown:
          type: array
          description: Tax breakdown by tax code across all passenger types.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_TaxBreakDown"
    NEXUZ-R-003-flights_PassengerWiseFare:
      type: object
      description: Fare amount for a specific passenger type.
      required:
        - passengerType
        - count
        - amount
      properties:
        passengerType:
          type: string
          description: Passenger type.
          enum:
            - adult
            - childA
            - childB
            - childC
            - infant
        count:
          type: integer
          description: Number of passengers of this type requested.
          example: 2
        amount:
          type: number
          format: decimal
          description: Total fare for this passenger type.
          example: 46924
    NEXUZ-R-003-flights_TaxBreakDown:
      type: object
      description: Tax detail broken down by tax code.
      required:
        - taxCode
        - description
        - taxAmount
        - passengerWiseTaxes
      properties:
        taxCode:
          type: string
          description: Tax code identifier.
          example: TK
        description:
          type: string
          description: Human-readable tax description.
          example: International Tourist Tax(JAPAN)
        taxAmount:
          type: number
          format: decimal
          description: Total tax amount for this tax code across all passengers.
          example: 4000
        passengerWiseTaxes:
          type: array
          description: Tax amount for this tax code broken down per passenger type.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_PassengerWiseTax"
    NEXUZ-R-003-flights_PassengerWiseTax:
      type: object
      description: Tax amount for a specific passenger type under a given tax code.
      required:
        - passengerType
        - passengerCount
        - amount
      properties:
        passengerType:
          type: string
          description: Passenger type.
          enum:
            - adult
            - childA
            - childB
            - childC
            - infant
        passengerCount:
          type: integer
          description: Number of passengers of this type.
          example: 2
        amount:
          type: number
          format: decimal
          description: Tax amount for this passenger type under this tax code.
          example: 2000
    NEXUZ-R-003-flights_FareDetail:
      type: object
      description: Detailed fare information for a single passenger type within a cabin.
      required:
        - fareId
        - fareBasisCode
        - passengerType
        - fareAmt
        - baseFareAmtInclTax
        - fareAmtInclTax
        - amtInclTax
        - taxes
      properties:
        fareId:
          type: integer
          description: Fare ID.
          example: 35223
        fareClass:
          type: string
          nullable: true
          description: Fare class code.
          example: "Y"
        fareBasisCode:
          type: string
          description: Fare basis code.
          example: U0ZFA0A
        passengerType:
          type: string
          description: Passenger type.
          enum:
            - adult
            - childA
            - childB
            - childC
            - infant
        availableSeat:
          type: integer
          nullable: true
          description: Number of available seats.
          example: 5
        baseFareAmt:
          type: number
          format: decimal
          nullable: true
          description: Base fare amount excluding taxes.
          example: 23462
        fareAmt:
          type: number
          format: decimal
          description: Fare amount excluding taxes.
          example: 24346
        baseFareAmtInclTax:
          type: number
          format: decimal
          description: Base fare amount including taxes before promotion discount.
          example: 24657
        fareAmtInclTax:
          type: number
          format: decimal
          description: Total fare amount including taxes after promotion discount.
          example: 24657
        amtInclTax:
          type: number
          format: decimal
          description: Fare amount including taxes after promotion discount.
          example: 24657
        taxes:
          type: array
          description: List of applicable taxes for this fare.
          items:
            $ref: "#/components/schemas/NEXUZ-R-003-flights_Tax"
    NEXUZ-R-003-flights_Tax:
      type: object
      description: Individual tax detail applied to a fare.
      required:
        - id
        - amount
        - taxCode
        - taxDesc
      properties:
        id:
          type: integer
          description: Tax ID.
          example: 582
        amount:
          type: number
          format: decimal
          description: Tax amount in the requested currency.
          example: 1200
        taxCode:
          type: string
          description: Tax code.
          example: TK
        taxDesc:
          type: string
          description: Tax description.
          example: International Tourist Tax(JAPAN)
    NEXUZ-R-003-flights_ErrorResponse:
      type: object
      description: Standard error response body.
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Application-level error code.
          example: NEXUZCMNE001
        description:
          type: string
          description: Error description.
          example: Required Input is Missing
    NEXUZ-R-004-offers_ErrorResponse:
      type: object
      description: Standard error response body returned when the API fails.
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Application-specific error code.
          example: NEXUZCMNE001
        description:
          type: string
          description: Human-readable explanation of the error.
          example: Required Input is Missing
    NEXUZ-R-004-offers_BundleRequest:
      type: object
      description: >-
        Request payload containing flight route, passenger composition, and
        flight segment details.
      required:
        - routes
        - adult
        - outbound
      properties:
        routes:
          type: string
          description: Comma-separated airport codes (e.g., BKK,NRT).
          pattern: ^[A-Z]{3},[A-Z]{3}(,[A-Z]{3})?$
          example: BKK,NRT
        adult:
          description: number of adult passengers.
          type: integer
          minimum: 1
          maximum: 9
          example: 1
        childA:
          description: number of child passengers in category A.
          type: integer
          example: 1
          minimum: 1
          maximum: 9
        childB:
          description: number of child passengers in category B.
          type: integer
          example: 1
          minimum: 1
          maximum: 9
        childC:
          description: number of child passengers in category C.
          type: integer
          example: 1
          minimum: 1
          maximum: 9
        infant:
          description: number of infant passengers.
          type: integer
          example: 1
          minimum: 1
          maximum: 9
        outbound:
          type: array
          description: >
            Flight details for the outbound journey. For one-way trips, only
            `outbound` is required. For round-trips, both `outbound` and
            `inbound` are required.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_Flight"
        inbound:
          type: array
          description: >
            Flight details for the inbound journey. Required only for
            round-trips.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_Flight"
    NEXUZ-R-004-offers_Flight:
      description: >-
        Flight details including departure date, cabin class, logical flight ID,
        fare basis code, and fare class.
      type: object
      required:
        - departureDate
        - cabin
        - lfid
      properties:
        departureDate:
          description: Departure date in `2026-06-28T23:10:00` format.
          type: string
          format: date
          example: "2026-06-28"
        cabin:
          description: >-
            Cabin class for the flight. Valid values are "STANDARD" and
            "ZIPFULLFLAT".
          type: string
          enum:
            - STANDARD
            - ZIPFULLFLAT
        lfid:
          description: Logical Flight ID (LFID) representing the flight segment.
          type: integer
          example: 12345
          minimum: 10000
          maximum: 99999
        fareBasisCode:
          description: Fare basis code for the flight.
          type: string
          example: FQYB45
        fareClass:
          description: Fare class for the flight.
          type: string
          example: U
    NEXUZ-R-004-offers_BundleResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: Bundle information organized by flight segments.
          type: array
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_SegmentWiseBundle"
    NEXUZ-R-004-offers_SegmentWiseBundle:
      description: >-
        Bundle information for a specific flight segment, identified by its
        Logical Flight ID (LFID).
      type: object
      required:
        - bundles
        - lfid
      properties:
        lfid:
          description: Logical Flight ID (LFID) representing the flight segment.
          type: integer
          example: 74982
        bundles:
          description: List of bundles available for the flight segment.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_Bundle"
    NEXUZ-R-004-offers_Bundle:
      description: >-
        Bundle information including bundle code and passenger types with their
        associated services.
      type: object
      required:
        - bundleCode
        - passengerTypes
      properties:
        bundleCode:
          description: Code representing the bundle.
          type: string
          example: VALU
        passengerTypes:
          description: >-
            List of passenger types and their associated services within the
            bundle.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_PassengerType"
    NEXUZ-R-004-offers_PassengerType:
      description: >-
        Information about a specific passenger type within a bundle, including
        the type, quantity, and associated services.
      type: object
      required:
        - type
        - amount
        - actualQuantity
        - bundleQuantity
        - categoryId
        - serviceId
        - cutoffHours
        - categories
      properties:
        type:
          description: Type of the passenger.
          type: string
          example: adult
        amount:
          description: Total amount for the passenger type within the bundle.
          type: number
          format: double
          example: 25001
        bundleQuantity:
          description: Quantity of the passenger type within the bundle.
          type: integer
          example: 1
        actualQuantity:
          description: >-
            Actual quantity of the passenger type which is determined based on
            count of each service for the passenger type in the bundle.
          type: integer
          example: 10
        categoryId:
          description: id representing categoryId of bundle.
          type: integer
          example: 142
        serviceId:
          description: id representing service id of bundle.
          type: integer
          example: 3
        cutoffHours:
          description: id representing representing cutoffHours of bundle
          type: integer
          example: 290
        categories:
          description: >-
            List of service categories and their associated services for the
            passenger type within the bundle.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_Category"
    NEXUZ-R-004-offers_Category:
      description: >-
        Information about a specific service category within a bundle, including
        the category name and associated services.
      type: object
      required:
        - category
        - services
      properties:
        category:
          description: Name of the service category such as "Baggage", "Seat", "Meal", etc.
          type: string
          example: meals
        services:
          description: List of services available within the category.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_Service"
    NEXUZ-R-004-offers_Service:
      description: >-
        Information about a specific service within a category, including the
        service code, quantity available, and description.
      type: object
      required:
        - code
        - quantityAvailable
        - description
      properties:
        code:
          description: Code representing the service.
          type: string
          example: MVAL
        quantityAvailable:
          description: Quantity of the service available.
          type: integer
          example: 260
        description:
          description: Description of the service.
          type: string
          example: Vegetarian meal option
    NEXUZ-R-004-offers_SeatMapRequest:
      type: object
      required:
        - cabin
        - currency
        - departureDateTime
        - routes
        - logicalFlightId
      properties:
        cabin:
          description: Cabin class selected by the user.
          type: string
          enum:
            - STANDARD
            - ZIPFULLFLAT
          example: STANDARD
        currency:
          description: Selected pricing currency.
          type: string
          example: JPY
        departureDateTime:
          description: Departure date time of the selected flight.
          type: string
          pattern: >-
            ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          example: "2026-06-28T23:10:00"
        routes:
          description: Origin and Destination airport details.
          type: string
          example: NRT,BKK
          pattern: ^[A-Z]{3},\s?[A-Z]{3}$
        logicalFlightId:
          description: Unique identifier of the selected flight (LFID).
          type: integer
          example: 74793
          pattern: ^\d+$
    NEXUZ-R-004-offers_FlightSeatMapResponse:
      type: object
      description: >-
        Response wrapper for seatmap includes seat Availbility of the cabin
        requested by the passenger.
      properties:
        data:
          type: object
          required:
            - seatInfo
          properties:
            seatInfo:
              type: array
              description: List of rows with associated seat details.
              items:
                $ref: "#/components/schemas/NEXUZ-R-004-offers_SeatInfo"
    NEXUZ-R-004-offers_SeatInfo:
      type: object
      description: List of rows with associated seat details.
      required:
        - row
        - seats
      properties:
        row:
          type: integer
          description: Represents  the row number.
          example: 26
        seats:
          type: array
          description: Contains the column seat details for the corresponding row cabin.
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_Seats"
    NEXUZ-R-004-offers_Seats:
      type: object
      description: Contains the column seat details for the corresponding row cabin.
      required:
        - column
        - isSeatAvailable
        - amount
        - serviceCode
      properties:
        column:
          type: string
          description: Represents the seat column position within the row.
          example: B
        isSeatAvailable:
          type: boolean
          description: Indicates whether the seat is available or not.
          example: true
        amount:
          type: number
          format: double
          description: amount for the requested seat.
          example: 2000.16
        serviceCode:
          type: string
          description: Service code associated with the seat.
          example: STOT
    NEXUZ-R-004-offers_AncillaryRequest:
      type: object
      required:
        - departureDate
        - lfid
        - origin
        - destination
        - serviceCategory
        - passengers
      properties:
        departureDate:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          description: Flight departure date in `yyyy-MM-dd` format.
          example: "2026-05-22"
        lfid:
          type: integer
          description: Logical flight ID.
          example: 74286
        origin:
          type: string
          pattern: ^[A-Z]{3}$
          description: Origin airport IATA code.
          example: BKK
        destination:
          type: string
          pattern: ^[A-Z]{3}$
          description: Destination airport IATA code.
          example: NRT
        serviceCategory:
          type: string
          description: Category of the services to retrieve.
          enum:
            - AMENITIES
            - MEALS
            - BAGGAGE
            - AKIBAZIP
            - INFLIGHTITEM
            - TRANSPORTATION
            - LOUNGE
        passengers:
          $ref: "#/components/schemas/NEXUZ-R-004-offers_Passengers"
    NEXUZ-R-004-offers_Passengers:
      type: object
      required:
        - adult
      properties:
        adult:
          type: integer
          minimum: 1
          description: Number of adult passengers.
          example: 1
        childA:
          type: integer
          minimum: 0
          description: Number of child passengers in category A.
        childB:
          type: integer
          minimum: 0
          description: Number of child passengers in category B.
        childC:
          type: integer
          minimum: 0
          description: Number of child passengers in category C.
        infant:
          type: integer
          minimum: 0
          description: Number of infant passengers.
    NEXUZ-R-004-offers_AncillaryResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NEXUZ-R-004-offers_ServiceGroup"
    NEXUZ-R-004-offers_ServiceGroup:
      type: object
      required:
        - servicesPerPassengerType
      properties:
        servicesPerPassengerType:
          type: array
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_ServicesPerPassengerType"
    NEXUZ-R-004-offers_ServicesPerPassengerType:
      type: object
      required:
        - passengerType
        - categories
      properties:
        passengerType:
          type: string
          description: Passenger type based on age.
          enum:
            - adult
            - childA
            - childB
            - childC
            - infant
        categories:
          type: array
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_ServiceCategory"
    NEXUZ-R-004-offers_ServiceCategory:
      type: object
      required:
        - title
        - categoryId
        - specialServices
      properties:
        title:
          type: string
          description: Category title.
          example: In-Flight Meals
        categoryId:
          type: integer
          description: Category ID.
          example: 6
        specialServices:
          type: array
          items:
            $ref: "#/components/schemas/NEXUZ-R-004-offers_SpecialService"
    NEXUZ-R-004-offers_SpecialService:
      type: object
      required:
        - lfid
        - amount
        - currency
        - cutOffHours
        - description
        - maxCountServiceLevel
        - qtyAvailable
        - ssrCode
        - ssrId
        - startSalesDays
      properties:
        lfid:
          type: integer
          description: Logical flight ID.
          example: 74286
        amount:
          type: number
          format: double
          description: Amount of the special service.
          example: 1500
        currency:
          type: string
          description: Currency of the amount.
          example: JPY
        cutOffHours:
          type: integer
          description: >-
            Time limit (hrs) to purchase the special service before flight
            departure.
          example: 24
        description:
          type: string
          description: Description of the special service.
          example: Vegetarian Meal
        maxCountServiceLevel:
          type: integer
          description: Maximum available quantity of the special service.
          example: 20
        qtyAvailable:
          type: integer
          description: Current available quantity of the special service.
          example: 10
        ssrCode:
          type: string
          description: SSR code of the special service.
          example: VGML
        ssrId:
          type: integer
          description: SSR ID of the special service.
          example: 123
        startSalesDays:
          type: integer
          description: Number of days until sales start.
          example: 0
        pfid:
          type: integer
          description: Physical flight ID.
          example: 69426
    NEXUZ-R-005_APIs_SummaryRequest:
      type: object
      required:
        - tripType
        - reservationAmount
        - flights
        - passengers
      properties:
        tripType:
          type: string
          description: Trip type classification.
          enum:
            - oneway
            - onewayConnecting
            - roundTrip
          example: oneway
        promotionCode:
          type: string
          description: Alphanumeric promotion code (optional).
          pattern: ^[a-zA-Z0-9]+$
          example: ABC
        reservationAmount:
          type: number
          minimum: 0
          description: Total reservation amount.
          example: 10000.01
        flights:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_Flights"
        passengers:
          type: array
          description: List of passengers in the booking.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_PassengerDetails"
    NEXUZ-R-005_APIs_Flights:
      type: object
      required:
        - outbound
      properties:
        outbound:
          type: array
          description: Outbound flight info.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_FlightBound"
        inbound:
          type: array
          description: Inbound flight info.
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_FlightBound"
    NEXUZ-R-005_APIs_FlightBound:
      type: object
      required:
        - segments
      properties:
        segments:
          type: array
          description: List of flight segments within bound.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_FlightSegment"
    NEXUZ-R-005_APIs_FlightSegment:
      type: object
      required:
        - carrierCode
        - origin
        - destination
        - flightNumber
        - pfid
        - lfid
        - cabin
        - scheduledDepartureArrivalDateTime
        - fareDetails
      properties:
        carrierCode:
          type: string
          description: Airline carrier code.
          example: ZG
        origin:
          type: string
          description: 3-letter IATA airport code for departure.
          pattern: ^[A-Za-z]{3}$
          example: NRT
        destination:
          type: string
          description: 3-letter IATA airport code for arrival.
          pattern: ^[A-Za-z]{3}$
          example: SIN
        flightNumber:
          type: integer
          description: Numeric flight number.
          example: 1234
        pfid:
          type: integer
          minimum: 1
          description: Physical Flight ID (PFID).
          example: 2341
        lfid:
          type: integer
          minimum: 1
          description: Logical Flight ID (LFID).
          example: 2312
        cabin:
          type: string
          description: Cabin type/class.
          enum:
            - STANDARD
            - ZIPFULLFLAT
          example: STANDARD
        scheduledDepartureArrivalDateTime:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_ScheduledDateTime"
        fareDetails:
          type: array
          description: Fare details for the segment.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_FareDetails"
    NEXUZ-R-005_APIs_ScheduledDateTime:
      type: object
      required:
        - departureDateTime
        - arrivalDateTime
      properties:
        departureDateTime:
          type: string
          description: Scheduled departure date and time.
          pattern: >-
            ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          example: "2026-06-28T10:00:00"
        arrivalDateTime:
          type: string
          description: Scheduled arrival date and time.
          pattern: >-
            ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          example: "2026-06-28T16:00:00"
    NEXUZ-R-005_APIs_FareDetails:
      type: object
      required:
        - fareId
        - fareClass
        - fareBasisCode
        - passengerType
        - baseFareAmtInclTax
        - amtInclTax
      properties:
        fareId:
          type: integer
          minimum: 1
          description: Numeric fare identifier.
          example: 12
        fareClass:
          type: string
          description: Single alphabetic character representing fare class.
          pattern: ^[A-Za-z]$
          example: C
        fareBasisCode:
          type: string
          description: Alphanumeric fare basis code.
          pattern: ^[a-zA-Z0-9]+$
          example: Y0ZSC0A
        passengerType:
          type: string
          description: Passenger type in fare details.
          example: Adult
        baseFareAmtInclTax:
          type: number
          minimum: 0
          description: Base fare amount including tax.
          example: 10000.12
        amtInclTax:
          type: number
          minimum: 0
          description: Amount including tax.
          example: 9000.23
    NEXUZ-R-005_APIs_PassengerDetails:
      type: object
      required:
        - id
        - passengerType
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - nationality
        - isPrimaryPassenger
        - contactInformation
      properties:
        id:
          type: integer
          description: Unique passenger identifier.
          minimum: 1
          maximum: 9
          example: 2
        passengerType:
          type: string
          description: Passenger type classification.
          enum:
            - Adult
            - ChildA
            - ChildB
            - ChildC
            - Infant
          example: Adult
        associateWithPassengerId:
          type: integer
          minimum: 1
          description: Adult passenger this passenger is associated with (optional).
          example: 1
        firstName:
          type: string
          description: |
            **Passenger first name.**
            - Alphanumeric characters only
            - Length: 1 to 64 characters
          pattern: ^[A-Za-z]{1,64}$
          example: PETER
        middleName:
          type: string
          description: Passenger middle name.
          pattern: ^[A-Za-z]{1,64}$
          example: DRAKE
        lastName:
          type: string
          description: Passenger last name.
          pattern: ^[A-Za-z]{1,64}$
          example: PARKER
        dateOfBirth:
          type: string
          description: Date of birth.
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: "2000-07-20"
        gender:
          type: string
          description: Passenger gender.
          enum:
            - M
            - F
          example: M
        redressNumber:
          type: string
          description: Redress number.
          pattern: ^[a-zA-Z0-9]{1,25}$
          example: RED12345
        knownTravelerNumber:
          type: string
          description: Known Traveler Number.
          pattern: ^[a-zA-Z0-9]{1,9}$
          example: KTN12345
        nationality:
          type: string
          description: 3-character ISO country code.
          minLength: 3
          maxLength: 3
          example: JPN
        isPrimaryPassenger:
          type: boolean
          description: Indicates primary passenger in booking.
          example: true
        height:
          type: integer
          description: Passenger height in centimeters (optional).
          example: 170
        weight:
          type: number
          minimum: 0
          description: Passenger weight in kilograms (optional).
          example: 70
        contactInformation:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_ContactInformation"
        emergencyContact:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_EmergencyContact"
        marketingMails:
          type: boolean
          description: Opt-in for marketing emails (optional).
          example: true
        seats:
          type: array
          description: Seat selections by passenger (optional).
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_Seat"
        services:
          type: array
          description: Ancillary services for passenger (optional).
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_Service"
        bundles:
          type: array
          description: Bundles selected by passenger (optional).
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_Bundle"
    NEXUZ-R-005_APIs_ContactInformation:
      type: object
      required:
        - countryCode
        - phoneNumber
        - email
      properties:
        countryCode:
          type: string
          description: Country dialling code.
          pattern: ^\+?[0-9]+$
          example: "+91"
        phoneNumber:
          type: string
          description: Contact phone number.
          pattern: ^[0-9]{1,15}$
          example: "8239823240"
        email:
          type: string
          format: email
          description: Contact email address.
          example: test@test.com
    NEXUZ-R-005_APIs_EmergencyContact:
      type: object
      properties:
        countryCode:
          type: string
          description: Emergency contact country dialling code.
          pattern: ^\+?[0-9]+$
          example: "+81"
        phoneNumber:
          type: string
          description: Emergency contact phone number.
          pattern: ^[0-9]{1,15}$
          example: "1233324121"
    NEXUZ-R-005_APIs_Seat:
      type: object
      required:
        - lfid
        - pfid
        - row
        - column
        - serviceCode
        - amount
      properties:
        lfid:
          type: integer
          minimum: 1
          description: Logical Flight ID for the seat.
          example: 1234
        pfid:
          type: integer
          minimum: 1
          description: Physical Flight ID for the seat.
          example: 1222
        row:
          type: integer
          description: Seat row number.
          example: 2
        column:
          type: string
          maxLength: 1
          description: Seat column (alphabetic).
          pattern: ^[A-Za-z]$
          example: A
        serviceCode:
          type: string
          description: 4-character SSR code for seat.
          pattern: ^[A-Z]{4}$
          example: STEA
        amount:
          type: number
          minimum: 0
          description: Seat price (numeric with max 2 decimal places).
          example: 1232.12
        bundleCode:
          type: string
          description: 4-character bundle code associated with seat (optional).
          pattern: ^[A-Z]{4}$
          example: STTR
    NEXUZ-R-005_APIs_Service:
      type: object
      required:
        - lfid
        - pfid
        - amount
        - categoryId
        - ssrCode
        - serviceID
      properties:
        lfid:
          type: integer
          minimum: 1
          description: Logical Flight ID for the service.
          example: 1231
        pfid:
          type: integer
          minimum: 1
          description: Physical Flight ID for the service.
          example: 4123
        amount:
          type: number
          minimum: 0
          description: Service amount (numeric with max 2 decimal places).
          example: 8721.23
        categoryId:
          type: integer
          minimum: 1
          description: Service category identifier.
          example: 123
        ssrCode:
          type: string
          description: 4-character SSR code.
          pattern: ^[A-Z]{4}$
          example: STTR
        serviceID:
          type: integer
          minimum: 1
          description: Numeric service identifier.
          example: 123
        chargeComment:
          type: string
          description: Descriptive comment for service charge (optional).
          example: test comment
        bundleCode:
          type: string
          description: 4-character bundle code (optional).
          pattern: ^[A-Z]{4}$
          example: SRRD
    NEXUZ-R-005_APIs_Bundle:
      type: object
      required:
        - lfid
        - pfid
        - bundleCode
        - amount
        - serviceId
        - categoryId
      properties:
        lfid:
          type: integer
          minimum: 1
          description: Logical Flight ID for the bundle.
          example: 1232
        pfid:
          type: integer
          minimum: 1
          description: Physical Flight ID for the bundle.
          example: 2123
        bundleCode:
          type: string
          description: 4-character bundle code.
          pattern: ^[A-Z]{4}$
          example: STTR
        amount:
          type: number
          minimum: 0
          description: Bundle amount (numeric with max 2 decimal places).
          example: 9000.12
        categoryId:
          type: integer
          minimum: 1
          description: Bundle category identifier.
          example: 231
        serviceId:
          type: integer
          minimum: 1
          description: Numeric service identifier for bundle.
          example: 123
    NEXUZ-R-005_APIs_SummaryResponse:
      type: object
      required:
        - data
      description: Successful order preparation response.
      properties:
        data:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_ResponseData"
        warning:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_WarningMessage"
    NEXUZ-R-005_APIs_ResponseData:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Encrypted Arkose token for fraud detection.
          example: token_value_here
    NEXUZ-R-005_APIs_CreateOrderRequest:
      type: object
      required:
        - verifyToken
        - passengers
        - recipientInfo
      properties:
        verifyToken:
          type: string
          description: Encrypted value for arkose verification.
          example: qnh+bFiw+Lytmlce.+tHLil0Off7v7oAFCICjF/
        passengers:
          type: array
          description: List of passengers.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_Passenger"
        recipientInfo:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_RecipientInfo"
    NEXUZ-R-005_APIs_Passenger:
      type: object
      required:
        - id
        - passengerType
        - firstName
        - lastName
        - gender
        - dateOfBirth
        - nationality
        - documents
      properties:
        id:
          type: integer
          description: Passenger identifier.
          example: 1
        passengerType:
          type: string
          description: Passenger type.
          enum:
            - Adult
            - ChildA
            - ChildB
            - ChildC
            - Infant
          example: Adult
        firstName:
          type: string
          description: Passenger first name.
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z]+$
          example: PETER
        middleName:
          type: string
          description: Passenger middle name.
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z]+$
          example: JOHN
        lastName:
          type: string
          description: Passenger last name.
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z]+$
          example: JAMES
        gender:
          type: string
          description: Passenger gender.
          enum:
            - M
            - F
          example: M
        dateOfBirth:
          type: string
          description: Passenger date of birth.
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          example: "2000-07-11"
        nationality:
          type: string
          description: Passenger nationality.
          pattern: ^[A-Za-z]{3}$
          example: JPN
        residenceCountry:
          type: string
          description: Passenger residence country.
          pattern: ^[A-Za-z]{3}$
          example: JPN
        destinationAddress:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_DestinationAddress"
        documents:
          type: array
          description: Passenger travel documents.
          minItems: 1
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_Document"
    NEXUZ-R-005_APIs_DestinationAddress:
      type: object
      properties:
        country:
          type: string
          description: Destination country.
          example: JPN
        postalCode:
          type: string
          description: Destination postal code.
          pattern: ^\d{2,10}$
          example: "12345"
        state:
          type: string
          description: Destination state.
          pattern: ^[A-Za-z]+$
          example: Tokyo
        city:
          type: string
          description: Destination city.
          pattern: ^[A-Za-z]+$
          example: Chiyoda
        address:
          type: string
          description: Destination address.
          pattern: ^[A-Za-z0-9 ]+$
          example: Example Street
    NEXUZ-R-005_APIs_Document:
      type: object
      required:
        - documentId
        - documentNumber
        - expiryDate
        - isScanned
      properties:
        documentId:
          type: integer
          description: Document type ID.
          example: 1
        documentNumber:
          type: string
          description: Document number.
          example: HUF13345
        issuedCountry:
          type: string
          description: Issued country.
          example: JPN
        expiryDate:
          type: string
          description: Document expiry date.
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          example: "2026-06-06"
        isScanned:
          type: boolean
          description: Indicates whether the document was scanned.
          example: true
    NEXUZ-R-005_APIs_CreateOrderResponse:
      type: object
      required:
        - data
      properties:
        warnings:
          description: Array of warning messages
          type: array
          items:
            $ref: "#/components/schemas/NEXUZ-R-005_APIs_WarningMessage"
        data:
          $ref: "#/components/schemas/NEXUZ-R-005_APIs_OrderData"
    NEXUZ-R-005_APIs_OrderData:
      type: object
      required:
        - statusCheckKey
        - paymentReferenceId
        - redirectionUrl
      properties:
        statusCheckKey:
          type: string
          description: This field contains the orderId.
        paymentReferenceId:
          type: string
          description: This field contains the ReservationPaymentID.
        redirectionUrl:
          type: string
          description: This field contains the UI redirection URL.
    NEXUZ-R-005_APIs_RecipientInfo:
      type: object
      required:
        - firstName
        - lastName
        - emailAddress
      properties:
        firstName:
          type: string
          description: Recipient first name.
          example: TEST
        lastName:
          type: string
          description: Recipient last name.
          example: TEST
        middleName:
          type: string
          description: Recipient middle name.
          example: TEST
        emailAddress:
          type: string
          description: Recipient email address.
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
          example: abc@gmail.com
    NEXUZ-R-005_APIs_ErrorResponse:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Custom error code
        description:
          type: string
          description: Error description
    NEXUZ-R-005_APIs_WarningMessage:
      type: object
      required:
        - code
        - description
      properties:
        code:
          description: An application-specific error code
          type: string
        description:
          type: string
          description: Warning description
    NEXUZ-R-006-payment_InitializePaymentRequest:
      type: object
      required:
        - confirmationNumber
        - baseAmount
        - datePaid
        - exchangeRate
        - exchangeRateDate
        - expirationDate
        - originalAmount
        - paymentAmount
        - personOrgID
        - dob
        - age
        - firstName
        - gender
        - lastName
        - marketingOptIn
        - nationality
        - contactInfos
        - recipientInfo
      properties:
        confirmationNumber:
          type: string
          description: Reservation confirmation number (PNR).
          example: 6RIZGP
        baseAmount:
          type: number
          format: decimal
          description: Base payment amount.
          example: 12345.12
        datePaid:
          type: string
          pattern: >-
            ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          description: Date and time of payment in ISO 8601 format.
          example: "2026-05-21T11:55:12"
        exchangeRate:
          type: number
          format: decimal
          description: Exchange rate applied for currency conversion.
          example: 1
        exchangeRateDate:
          type: string
          pattern: >-
            ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          description: Date and time when the exchange rate was captured.
          example: "2026-05-21T11:55:12"
        expirationDate:
          type: string
          pattern: >-
            ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          description: Payment expiration date and time.
          example: "2026-05-21T11:55:12"
        originalAmount:
          type: number
          format: decimal
          description: Original payment amount before conversion.
          example: 12346.12
        paymentAmount:
          type: number
          format: decimal
          description: Final payment amount to be processed.
          example: 12345.12
        personOrgID:
          type: integer
          description: Person/Organization ID of the payor.
          example: 123
        dob:
          type: string
          format: date
          description: Date of birth of the payor (YYYY-MM-DD).
          example: "2026-05-21"
        age:
          type: integer
          description: Age of the payor in years.
          example: 25
        firstName:
          type: string
          description: First name of the payor.
          example: JAMES
        middleName:
          type: string
          description: Middle name of the payor.
          example: PETER
        gender:
          type: string
          enum:
            - M
            - F
          description: Gender of the payor.
          example: M
        lastName:
          type: string
          description: Last name of the payor.
          example: PETER
        marketingOptIn:
          type: boolean
          description: Whether the payor has opted in for marketing communications.
          example: false
        nationality:
          type: string
          description: Nationality country code of the payor.
          example: JPN
        contactInfos:
          type: array
          minItems: 1
          description: List of contact information for the payor.
          items:
            $ref: "#/components/schemas/NEXUZ-R-006-payment_ContactInfo"
        recipientInfo:
          $ref: "#/components/schemas/NEXUZ-R-006-payment_RecipientInfo"
    NEXUZ-R-006-payment_ContactInfo:
      type: object
      required:
        - contactID
        - personOrgID
        - contactField
        - contactType
      properties:
        contactID:
          type: integer
          description: Unique identifier for the contact record.
          example: 1
        personOrgID:
          type: integer
          description: Person/Organization ID associated with this contact.
          example: 123
        contactField:
          type: string
          description: Contact value (phone number or email).
          example: "+81078625673"
        contactType:
          type: string
          enum:
            - Workphone
            - Mobilephone
            - Email
          description: Type of contact (e.g., Workphone, Email).
          example: Workphone
    NEXUZ-R-006-payment_RecipientInfo:
      type: object
      required:
        - firstName
        - lastName
        - emailAddress
      properties:
        firstName:
          type: string
          description: Recipient first name for receipt issuance.
          example: TEST
        lastName:
          type: string
          description: Recipient last name for receipt issuance.
          example: TEST
        middleName:
          type: string
          description: Recipient middle name for receipt issuance.
          example: TEST
        emailAddress:
          type: string
          description: Recipient email address for receipt issuance.
          example: abc@gmail.com
    NEXUZ-R-006-payment_InitializePaymentResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - statusCheckKey
            - paymentReferenceId
            - redirectionUrl
          properties:
            statusCheckKey:
              type: string
              description: This field contains the orderId received from the POP.
              example: qytwdqytwcqtwbcbequyuqyhehuyq12
            paymentReferenceId:
              type: integer
              description: |
                This field contains the ReservationPaymentID.
              example: 1275136
            redirectionUrl:
              type: string
              description: This field contains the UI redirection URL.
              example: https://pop-payment-redirect.example.com/order/xyz
    NEXUZ-R-006-payment_PaymentStatusRequest:
      type: object
      description: Request body for retrieving payment status.
      required:
        - paymentReferenceId
      properties:
        paymentReferenceId:
          type: integer
          description: Reference ID for the payment transaction.
          example: 123
    NEXUZ-R-006-payment_PaymentStatusResponse:
      type: object
      description: Response body for retrieving payment status.
      required:
        - data
      properties:
        warning:
          $ref: "#/components/schemas/NEXUZ-R-006-payment_WarningItem"
        data:
          $ref: "#/components/schemas/NEXUZ-R-006-payment_PaymentOrder"
    NEXUZ-R-006-payment_WarningItem:
      type: object
      description: Standard warning returned when the API encounters partial failures.
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Custom warning code.
          example: NEXUZR006W001
        description:
          type: string
          description: Warning description.
          example: Unable to proceed further
    NEXUZ-R-006-payment_PaymentOrder:
      type: object
      description: Payment order representing the current state of the payment.
      required:
        - status
      properties:
        status:
          type: string
          description: The status of the payment.
          enum:
            - Success
            - Failed
            - Pending
        confirmationNumber:
          type: string
          description: >-
            PNR number associated with the payment. This field is present only
            when the status is 'Success'.
          example: ABC123
    NEXUZ-R-006-payment_ErrorResponse:
      type: object
      description: Standard error response body.
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Application-level error code.
          example: NEXUZCMNE001
        description:
          type: string
          description: Error description.
          example: Required input is missing
    NEXUZ-R-007-order-management_ErrorResponse:
      type: object
      description: Standard error response body returned when the API fails.
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: Application-specific error code.
          example: NEXUZCMNE001
        description:
          type: string
          description: Human-readable error message.
          example: Required input is missing
    NEXUZ-R-007-order-management_PnrInfoRequest:
      type: object
      description: Request body for retrieving PNR details.
      required:
        - confirmationNumber
      properties:
        confirmationNumber:
          type: string
          description: confirmation number.
          pattern: ^[a-zA-Z0-9]+$
          example: 2X7IVO
    NEXUZ-R-007-order-management_PnrInfoResponse:
      type: object
      description: Response body containing PNR details.
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_PnrData"
    NEXUZ-R-007-order-management_PnrData:
      type: object
      required:
        - airlineInfo
        - passenger
        - ticket
        - issuer
        - flight
        - invoiceNumber
        - agent
        - capture
      properties:
        airlineInfo:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_AirlineInfo"
        passenger:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Passenger"
        ticket:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Ticket"
        issuer:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Issuer"
        flight:
          type: array
          description: Flight detail present in the reservation.
          items:
            $ref: "#/components/schemas/NEXUZ-R-007-order-management_Flight"
        invoiceNumber:
          type: string
          description: Invoice Number.
          default: ""
          example: ""
        agent:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Agent"
        capture:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Capture"
    NEXUZ-R-007-order-management_AirlineInfo:
      type: object
      required:
        - code
        - airline
      properties:
        code:
          type: string
          description: Carrier code of the airline.
          default: ZG
          example: ZG
        airline:
          type: string
          description: Name of the Airline.
          default: ZipAir
          example: ZipAir
    NEXUZ-R-007-order-management_Passenger:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          description: Passenger code.
          default: UNKNOWN
          example: UNKNOWN
        name:
          type: string
          description: Name of the Passenger.
          example: FIRSTLAST FIRSTFIRST FIRSTMIDDLE
    NEXUZ-R-007-order-management_Ticket:
      type: object
      required:
        - code
        - adultCount
        - childCount
        - restricted
        - issueDate
      properties:
        code:
          type: string
          description: Confirmation number.
          example: 2X7IVO
        adultCount:
          type: integer
          description: Count of the Adult Passengers.
          example: 1
        childCount:
          type: integer
          minimum: 0
          description: Count of the Child passengers.
          example: 3
        restricted:
          type: integer
          default: 0
          example: 0
        issueDate:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_DateParts"
    NEXUZ-R-007-order-management_Issuer:
      type: object
      required:
        - address1
        - postalCode
        - city
        - countryCode
      properties:
        address1:
          type: string
          default: ZipAir
          example: ZipAir
          description: Name of the issuer.
        postalCode:
          type: string
          default: "1400002"
          description: Postal Code of the city.
          example: "1400002"
        city:
          type: string
          default: Tokyo
          description: Name of the city.
          example: Tokyo
        countryCode:
          type: string
          default: JP
          description: Country Code of the city.
          example: JP
    NEXUZ-R-007-order-management_Flight:
      type: object
      required:
        - carrierCode
        - flightCode
        - stopOverCode
        - departureAirport
        - arrivalAirport
        - departureDate
        - fare
        - amount
      properties:
        carrierCode:
          type: string
          description: Carrier Code of the Airline.
          example: ZG
        flightCode:
          type: string
          description: Operating FlightId.
          example: ZG095
        stopOverCode:
          type: integer
          description: Stop Over Code of the flight.
          default: 0
          example: 0
        departureAirport:
          type: string
          description: Departure airport code.
          example: NRT
        arrivalAirport:
          type: string
          description: Arrival airport code.
          example: MNL
        departureDate:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_DateParts"
        fare:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Fare"
        amount:
          $ref: "#/components/schemas/NEXUZ-R-007-order-management_Amount"
    NEXUZ-R-007-order-management_Fare:
      type: object
      required:
        - class
        - basis
      properties:
        class:
          type: string
          description: Fare Class of the cabin
          example: O
        basis:
          type: string
          description: Fare Basis Code of the cabin
          example: O0ZSA0A
    NEXUZ-R-007-order-management_Amount:
      type: object
      required:
        - value
        - currencyCode
        - exponent
      properties:
        value:
          type: number
          description: Amount to be paid by the passenger.
          example: 28360
        currencyCode:
          type: string
          description: Currency denotion for amount.
          example: JPY
        exponent:
          type: integer
          example: 0
    NEXUZ-R-007-order-management_Agent:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          default: "0"
          example: "0"
          description: Agent Code.
        name:
          type: string
          default: ZipAir
          example: ZipAir
          description: Name of the Agent.
    NEXUZ-R-007-order-management_Capture:
      type: object
      required:
        - debitCreditIndicator
      properties:
        debitCreditIndicator:
          type: string
          default: credit
          description: Transaction Type.
          example: credit
    NEXUZ-R-007-order-management_DateParts:
      type: object
      required:
        - dayOfMonth
        - month
        - year
      properties:
        dayOfMonth:
          type: integer
          example: 5
        month:
          type: integer
          example: 6
        year:
          type: integer
          example: 2024
