# Release workflow — publishes packages under packages/* to AWS Code Artifacts.
#
# Features:
#   - Per-package versioning: Only increments version of packages with actual changes
#   - Detects changed packages using git diff
#   - Publishes to AWS Code Artifacts instead of GitHub Packages
#   - Automatic patch version bump for each release
#
# Required organization/repository variables (AWS):
#   - AWS_ACCOUNT_ID: AWS account ID (12 digits)
#   - NEXUZ_AWS_REGION: AWS region (e.g., ap-northeast-1)
#   - AWS_OIDC_ROLE_ARN: IAM role ARN for OIDC
#   - AWS_CODEARTIFACT_DOMAIN: CodeArtifact domain name (e.g., nexuz-dev-a)
#   - AWS_CODEARTIFACT_REPOSITORY: CodeArtifact repository name
#
# Required repository configuration:
#   Settings → Actions → General → Workflow permissions → "Read and write permissions".

name: Release

on:
  push:
    branches:
      - main
      - develop/**
      - release/**
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/artifacts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  NEXUZ_AWS_REGION: ${{ vars.NEXUZ_AWS_REGION }}
  AWS_CODEARTIFACT_DOMAIN: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}
  AWS_CODEARTIFACT_REPOSITORY: ${{ vars.AWS_CODEARTIFACT_REPOSITORY }}
  REGISTRY_URL: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}-${{ vars.AWS_ACCOUNT_ID }}.d.codeartifact.${{ vars.NEXUZ_AWS_REGION }}.amazonaws.com/npm/${{ vars.AWS_CODEARTIFACT_REPOSITORY }}/

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          # Get the list of changed files across the full push range.
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
          
          echo "Raw changed files:"
          echo "$CHANGED_FILES"
          
          # Extract unique package names only (not full paths)
          PACKAGES=$(echo "$CHANGED_FILES" | awk -F/ '/^packages\// {print $2}' | sort -u)
          
          if [ -z "$PACKAGES" ]; then
            echo "No package changes detected."
          fi
          
          # Convert to JSON array
          if [ -n "$PACKAGES" ]; then
            MATRIX=$(echo "$PACKAGES" | jq -R . | jq -s -c .)
          else
            MATRIX="[]"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          HAS_CHANGES=$([ -n "$PACKAGES" ] && echo 'true' || echo 'false')
          echo "has-changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "Changed packages: $MATRIX"

  release:
    name: Publish ${{ matrix.package }} to AWS Code Artifacts
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Debug AWS configuration
        run: |
          echo "AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}"
          echo "NEXUZ_AWS_REGION: ${{ vars.NEXUZ_AWS_REGION }}"
          echo "AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}"
          echo "AWS_CODEARTIFACT_DOMAIN: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.NEXUZ_AWS_REGION }}
          role-session-name: GitHubActions-Release

      - name: Validate required secrets and variables
        run: |
          echo "Checking required GitHub secrets and variables..."
          
          if [ -z "${{ env.AWS_CODEARTIFACT_DOMAIN }}" ]; then
            echo "❌ ERROR: AWS_CODEARTIFACT_DOMAIN variable is not set"
            echo "Add it to: GitHub → Organization/Repository → Settings → Variables"
            exit 1
          fi
          
          if [ -z "${{ env.AWS_CODEARTIFACT_REPOSITORY }}" ]; then
            echo "❌ ERROR: AWS_CODEARTIFACT_REPOSITORY variable is not set"
            echo "Add it to: GitHub → Organization/Repository → Settings → Variables"
            exit 1
          fi
          
          if [ -z "${{ env.AWS_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: AWS_ACCOUNT_ID variable is not set"
            exit 1
          fi
          
          if [ -z "${{ env.NEXUZ_AWS_REGION }}" ]; then
            echo "❌ ERROR: NEXUZ_AWS_REGION variable is not set"
            exit 1
          fi
          
          if [ -z "${{ vars.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "❌ ERROR: AWS_OIDC_ROLE_ARN variable is not set"
            exit 1
          fi
          
          echo "✅ All required secrets and variables are set"

      - name: Get AWS CodeArtifact authorization token
        id: codeartifact-token
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$AWS_CODEARTIFACT_DOMAIN" \
            --domain-owner "$AWS_ACCOUNT_ID" \
            --region "$NEXUZ_AWS_REGION" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "CodeArtifact token retrieved successfully"

      - name: Create .npmrc for AWS CodeArtifact
        run: |
          cat > ~/.npmrc << EOF
          //${{ env.REGISTRY_URL }}:_authToken=${{ steps.codeartifact-token.outputs.token }}
          always-auth=true
          registry=https://registry.npmjs.org/
          @nexuz:registry=https://${{ env.REGISTRY_URL }}
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Turbo pre-publish validation (when scripts exist)
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="${{ matrix.package }}"
          PACKAGE_JSON="packages/${PACKAGE}/package.json"

          if [ ! -f "${PACKAGE_JSON}" ]; then
            echo "ERROR: package.json not found for ${PACKAGE}"
            exit 1
          fi

          HAS_LINT=$(node -e "const s=require('./${PACKAGE_JSON}').scripts||{}; process.stdout.write(s.lint ? 'true' : 'false')")
          HAS_CHECK_TYPES=$(node -e "const s=require('./${PACKAGE_JSON}').scripts||{}; process.stdout.write(s['check-types'] ? 'true' : 'false')")

          if [ "${HAS_LINT}" = "true" ] && [ "${HAS_CHECK_TYPES}" = "true" ]; then
            echo "Running Turbo lint/check-types for package: ${PACKAGE}"
            pnpm turbo run lint check-types --filter="./packages/${PACKAGE}"
          else
            echo "Skipping Turbo validation for ${PACKAGE} (lint/check-types scripts not both present)."
          fi

      - name: Version package
        run: |
          set -euo pipefail
          PACKAGE="${{ matrix.package }}"
          if [ ! -f "packages/$PACKAGE/package.json" ]; then
            echo "ERROR: package.json not found for $PACKAGE"
            exit 1
          fi
          
          cd packages/$PACKAGE

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view "$PACKAGE_NAME" version --registry "https://${{ env.REGISTRY_URL }}" 2>/dev/null || true)

          NEXT_VERSION=$(node -e "
            const local = process.argv[1];
            const remote = process.argv[2] || '';
            const parse = (v) => v.split('.').map((n) => parseInt(n, 10) || 0);
            const gt = (a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a[i] > b[i]) return true;
                if (a[i] < b[i]) return false;
              }
              return false;
            };
            const base = remote && gt(parse(remote), parse(local)) ? remote : local;
            const v = parse(base);
            v[2] += 1;
            process.stdout.write(v.join('.'));
          " "$LOCAL_VERSION" "$REMOTE_VERSION")

          echo "Versioning $PACKAGE_NAME from local=$LOCAL_VERSION remote=${REMOTE_VERSION:-none} to next=$NEXT_VERSION"
          npm version "$NEXT_VERSION" --no-git-tag-version
          cd ../..

      - name: Publish package
        run: |
          PACKAGE="${{ matrix.package }}"
          if [ ! -f "packages/$PACKAGE/package.json" ]; then
            echo "ERROR: package.json not found for $PACKAGE"
            exit 1
          fi
          
          cd packages/$PACKAGE
          npm publish --access restricted
          cd ../..
        env:
          NPM_CONFIG_REGISTRY: https://${{ env.REGISTRY_URL }}
